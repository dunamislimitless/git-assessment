<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lomi Vibes</title>
    <style>
      :root {
        --bg: #f5efe6;
        --panel: #fffaf3;
        --ink: #2f241f;
        --muted: #7a665c;
        --peach: #f7c7b5;
        --sage: #c9d7c2;
        --gold: #e9d7a6;
        --rose: #f0d9d5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--bg), #efe4d3 45%, #f8f1e6);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(92vw, 820px);
        background: rgba(255, 250, 243, 0.8);
        border: 1px solid rgba(47, 36, 31, 0.08);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(78, 63, 54, 0.12);
        overflow: hidden;
        position: relative;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(8px);
        opacity: 0.8;
      }

      .card::before {
        width: 220px;
        height: 220px;
        background: var(--peach);
        top: -70px;
        right: -30px;
      }

      .card::after {
        width: 260px;
        height: 260px;
        background: var(--sage);
        bottom: -100px;
        left: -40px;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 48px 52px 38px;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.28rem;
        font-size: 0.73rem;
        color: var(--muted);
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 6vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
        font-weight: 600;
      }

      .accent {
        display: inline-block;
        background: linear-gradient(120deg, var(--gold), var(--peach));
        padding: 0.12em 0.22em;
        border-radius: 0.15em;
      }

      p {
        margin: 26px 0 0;
        max-width: 620px;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.26rem);
        line-height: 1.7;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 34px;
      }

      .tag {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(201, 215, 194, 0.55);
        border: 1px solid rgba(47, 36, 31, 0.08);
        color: var(--ink);
        font-size: 0.88rem;
        letter-spacing: 0.04em;
      }

      .tag:nth-child(2) {
        background: rgba(247, 199, 181, 0.52);
      }

      .tag:nth-child(3) {
        background: rgba(233, 215, 166, 0.6);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="content">
        <div class="eyebrow">Slow living / quiet joy</div>
        <h1>
          soft <span class="accent">vibes</span><br />
          for the soul
        </h1>
        <p>
          A little warmth, a little wonder, and a whole lot of calm — just the kind of html moodboard
          that makes the page feel like a deep breath.
        </p>

        <div class="row">
          <span class="tag">sunrise</span>
          <span class="tag">cozy</span>
          <span class="tag">dreamy</span>
        </div>
      </div>
    </main>
  </body>
</html>
